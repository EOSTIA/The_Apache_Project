# apache-httpd.conf
#
# A reverse proxy in front of all 4 services, terminating TLS and forwarding
# plain HTTP to each Spring Boot app. This is the piece you'd point to in an
# interview to say "I understand why you don't expose raw app servers to the
# internet directly."
#
# WHERE THIS GOES: Apache HTTP Server (httpd) is a separate install from
# Docker/Kafka/Redis. On Windows, install "Apache Lounge" builds or run this
# inside WSL (`sudo apt install apache2`). Either way, this file is meant to
# be included from your main httpd.conf, e.g.:
#   Include /path/to/config-tower/docker/apache-httpd.conf
#
# Required modules (enable with `a2enmod` on Linux/WSL, or uncomment
# LoadModule lines in httpd.conf on Windows):
#   mod_ssl, mod_proxy, mod_proxy_http, mod_ratelimit, mod_headers

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName config-tower.local

    SSLEngine on
    # Self-signed cert for local dev - generate with:
    #   openssl req -x509 -nodes -newkey rsa:2048 -keyout server.key -out server.crt -days 365
    SSLCertificateFile "/path/to/config-tower/certs/server.crt"
    SSLCertificateKeyFile "/path/to/config-tower/certs/server.key"

    # --- config-server (port 8080) ---
    ProxyPass        /api/config http://localhost:8080/api/config
    ProxyPassReverse /api/config http://localhost:8080/api/config

    # --- payments service (port 8081) ---
    ProxyPass        /api/payments http://localhost:8081/api/payments
    ProxyPassReverse /api/payments http://localhost:8081/api/payments

    # --- auth service (port 8082) ---
    ProxyPass        /api/auth http://localhost:8082/api/auth
    ProxyPassReverse /api/auth http://localhost:8082/api/auth

    # --- inventory service (port 8083) ---
    ProxyPass        /api/inventory http://localhost:8083/api/inventory
    ProxyPassReverse /api/inventory http://localhost:8083/api/inventory

    # Basic bandwidth-based rate limiting per connection (mod_ratelimit).
    # This throttles response throughput rather than blocking request counts
    # outright - it's the simplest built-in Apache mechanism and enough to
    # demonstrate the concept without adding mod_evasive/mod_security, which
    # would be overkill for a student project.
    <Location "/api">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 400
    </Location>

    # Security headers - small, easy to explain, good interview talking point
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog "logs/config-tower-error.log"
    CustomLog "logs/config-tower-access.log" combined
</VirtualHost>
</IfModule>

# Optional: redirect plain HTTP to HTTPS
<VirtualHost *:80>
    ServerName config-tower.local
    Redirect permanent / https://config-tower.local/
</VirtualHost>
